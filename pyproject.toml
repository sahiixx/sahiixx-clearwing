[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sahiixx-clearwing"
version = "0.1.0"
description = "Autonomous AI pentesting swarm — active probing with multi-agent reasoning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Sahiixx", email = "sahiixx@gmail.com"}]
keywords = ["pentesting", "security", "ai", "agent", "swarm", "fuzzing", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "pydantic>=2.0",
    "sahiixx-bus>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "mypy", "responses"]
llm = ["langchain-ollama>=0.1", "langchain-core>=0.2"]

[project.scripts]
clearwing = "clearwing.cli:main"

[project.urls]
Homepage = "https://github.com/sahiixx/sahiixx-clearwing"
Issues = "https://github.com/sahiixx/sahiixx-clearwing/issues"
